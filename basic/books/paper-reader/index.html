<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#ffffff;color:#353630;font:12px Arial,'Helvetica Neue',sans-serif}button,input,select{font:inherit;color:inherit}button,select{background:transparent;border:0;cursor:pointer}button{padding:10px 13px;min-height:40px}button:disabled{opacity:.25;cursor:default}button:hover{color:#df3cb1}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid #dc4eaf;outline-offset:3px}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #deded8}header strong{font-size:14px;font-weight:500;letter-spacing:.08em}header small{margin-left:20px;color:#88897e}#stage{position:absolute;inset:70px 0 100px;display:grid;place-items:center;overflow:hidden}#book{position:relative;width:min(88vw,calc((100vh - 185px)*1.1243));aspect-ratio:1.1243}#status{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#94958b}footer{position:absolute;bottom:0;left:0;right:0;height:100px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.controls{display:flex;align-items:center;gap:12px}.count{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}#hint{font-size:11px;color:#8b8d81}#settings{position:absolute;right:25px;top:64px;background:#fff;padding:24px;width:235px;z-index:10;box-shadow:0 8px 30px #0001;border:1px solid #e5e5df}#settings label{display:block;margin:16px 0 6px}#settings input,#settings select{width:100%}#settings p{font-size:11px;line-height:1.6;color:#999}#detail{border:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;background:#ffffff;padding:58px 20px 20px}#detail .close{position:fixed;right:22px;top:12px}#detailPages{height:100%;display:flex;align-items:flex-start;justify-content:center;overflow:auto;gap:0}#detailPages img{width:50%;max-width:800px;height:auto;display:block}#detailPages img:only-child{width:auto;max-width:100%;max-height:100%}#fallback{padding:20px;max-height:100%;overflow:auto}#fallback img{max-width:46%;vertical-align:top}#fullscreen{white-space:nowrap}
@media(max-width:650px){header{height:58px;padding:0 14px}header small{display:none}#stage{inset:58px 0 110px}#book{width:min(88vw,calc((100dvh - 180px)*.562));aspect-ratio:.562}footer{height:110px}.controls{gap:0}button{padding:9px}#detailPages{display:block}#detailPages img{width:100%;max-width:none}#settings{right:12px;top:55px}}

</style><script>if(new URLSearchParams(location.search).get('mode')==='room')document.documentElement.classList.add('room-reader');</script></head><body>
<header><div><strong>ZOU MENG</strong><select id="bookSelect" aria-label="本を選ぶ" style="margin-left:18px;padding:8px;max-width:150px"><option value="portfolio">作品集 · 新版</option><option value="landscape">ポートフォリオ・横</option><option value="life">Life</option><option value="life-supplement">Life · 付録</option><option value="helvetica">Helvetica</option><option value="hozzz">HOZZZ · 短いページ</option><option value="aota">AOTA · 蛇腹折り</option></select></div><div><button id="settingButton" aria-expanded="false">装丁設定</button><button id="fullscreen">全画面 ↗</button></div></header>
