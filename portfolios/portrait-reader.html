<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポートフォリオ — ZOU MENG</title>
<script src="/Portfolio/books/vendor/pdf.min.js"></script><script src="/Portfolio/books/vendor/page-flip.browser.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#b5b5b5;font:12px "IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace}body:fullscreen{background:#fafafa}
#stage{position:absolute;inset:8px 18px 58px;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}#book{position:relative;transition:transform .5s cubic-bezier(.22,.61,.36,1)}.leaf{background:white;overflow:hidden;box-shadow:0 1px 6px #00000009}.leaf canvas{width:100%;height:100%;display:block}.leaf:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 5px 0 14px -12px #0004}
#controls{position:absolute;inset:auto 16px 0;display:flex;gap:10px;height:48px;align-items:center;justify-content:center}button,input{font:inherit;color:inherit;background:transparent;border:0}button{cursor:pointer;padding:10px;min-height:40px;white-space:nowrap}button:hover,button:focus-visible{color:#ff5cd6}button:disabled{opacity:.3;cursor:default}input{width:42px;text-align:center;border-bottom:1px solid #e8e8e8;padding:4px;appearance:textfield}input::-webkit-inner-spin-button{appearance:none}#home{position:absolute;left:0}#fullscreen{position:absolute;right:0}#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}#loading[hidden]{display:none}
@media(max-width:600px){#stage{inset:8px 8px 82px}#controls{height:72px;gap:0;padding:0 45px}button{padding:8px}#fullscreen{right:-8px}#home{left:-8px}}
@media(prefers-reduced-motion:reduce){#book{transition:none}}
html.room-reader #fullscreen,html.room-reader #zoom,html.room-reader #home{display:none}
html.room-reader button:hover,html.room-reader button:focus-visible{color:#777}
</style><script>if(new URLSearchParams(location.search).has('room'))document.documentElement.classList.add('room-reader');</script></head><body><main id="stage" aria-label="両面の作品集"><div id="book"></div></main><div id="loading" role="status">読み込み中…</div>
<nav id="controls" aria-label="ページ操作"><button id="home">表紙</button><button id="prev" aria-label="前のページ">‹</button><span><input id="pageInput" type="number" min="1" value="1" aria-label="ページ番号"> / <span id="total">—</span></span><button id="next" aria-label="次のページ">›</button><button id="zoom">拡大</button><button id="fullscreen">全画面</button></nav>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='/Portfolio/books/vendor/pdf.worker.min.js';
const stage=document.getElementById('stage'),book=document.getElementById('book'),loading=document.getElementById('loading'),input=document.getElementById('pageInput');
const storageKey='room-portfolio-page:portrait.pdf';const report=status=>parent.postMessage({type:'room-book-status',status},location.origin);
let pdf,flip,index=0,width,height,serial=0,rebuilding=false,zoomed=false,resizeTimer,zoomCanvas=null;
const rendered=new Map(),jobs=new Map();
function remember(){try{sessionStorage.setItem(storageKey,String(index+1))}catch{}}
async function renderLeaf(i,ticket=serial){
 if(i<0||i>=pdf.numPages||rendered.has(i))return;
 if(jobs.has(i))return jobs.get(i);
 const job=(async()=>{const page=await pdf.getPage(i+1);const base=page.getViewport({scale:1});const view=page.getViewport({scale:Math.min(devicePixelRatio||1,2)*width/base.width});const canvas=document.createElement('canvas');canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);await page.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise;if(ticket!==serial)return;const leaf=book.querySelector(`[data-leaf="${i}"]`);if(leaf){leaf.replaceChildren(canvas);rendered.set(i,canvas)}})();
 jobs.set(i,job);try{await job}finally{if(ticket===serial)jobs.delete(i)}
}
async function nearby(){const current=index,ticket=serial;await Promise.all([current,current+1,current-1,current+2,current+3,current-2].map(i=>renderLeaf(i,ticket)));if(current===index&&ticket===serial){for(const i of rendered.keys()){if(Math.abs(i-current)>6){book.querySelector(`[data-leaf="${i}"]`)?.replaceChildren();rendered.delete(i)}}}}
function update(){
 index=flip.getCurrentPageIndex();input.value=index+1;book.dataset.page=index+1;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index>=pdf.numPages-1;
 const single=flip.getOrientation()==='portrait';book.style.transform=single?'none':index===0?`translateX(${-width/2}px)`:index>=pdf.numPages-1?`translateX(${width/2}px)`:'none';remember();nearby().catch(fail);
}
function fail(error){console.error(error);loading.hidden=false;loading.textContent='読み込めませんでした';report('error')}
async function build(){
 if(rebuilding)return;rebuilding=true;const saved=index;++serial;rendered.clear();jobs.clear();
 try{
  // Destroy removes the root element: recreate it so resizing/fullscreen keeps
  // one live PageFlip instance and preserves the logical printed page.
  if(flip){flip.destroy();stage.replaceChildren(book);book.replaceChildren()}
  const page=await pdf.getPage(1),base=page.getViewport({scale:1}),ratio=base.width/base.height;
  const single=stage.clientWidth<620;
  height=Math.min(stage.clientHeight-8,(stage.clientWidth-12)/(single?1:2)/ratio);width=Math.floor(height*ratio);height=Math.floor(height);
  book.style.width=(single?width:width*2)+'px';book.style.height=height+'px';
  const leaves=Array.from({length:pdf.numPages},(_,i)=>{const leaf=document.createElement('div');leaf.className='leaf';leaf.dataset.leaf=i;leaf.setAttribute('aria-label',`${i+1} / ${pdf.numPages}`);if(i===0||i===pdf.numPages-1)leaf.dataset.density='hard';book.append(leaf);return leaf});
  await Promise.all([saved,saved+1,saved-1,saved+2].map(i=>renderLeaf(i)));
  flip=new St.PageFlip(book,{width,height,size:'fixed',autoSize:false,usePortrait:single,showCover:true,startPage:saved,flippingTime:matchMedia('(prefers-reduced-motion: reduce)').matches?1:650,maxShadowOpacity:.16,drawShadow:true,mobileScrollSupport:false,swipeDistance:35,clickEventForward:true,showPageCorners:true});
  flip.on('flip',update);flip.on('changeOrientation',update);flip.loadFromHTML(leaves);update();loading.hidden=true;report('ready');
 }catch(error){fail(error)}finally{rebuilding=false}
}
async function go(target,animated=true){
 if(!flip||zoomed)return;target=Math.max(0,Math.min(pdf.numPages-1,target));await Promise.all([target,target+1,target-1].map(i=>renderLeaf(i)));if(animated)flip.flip(target);else{flip.turnToPage(target);update()}
}
document.getElementById('prev').onclick=()=>go(index-(flip.getOrientation()==='portrait'?1:2));document.getElementById('next').onclick=()=>go(index+(index===0||flip.getOrientation()==='portrait'?1:2));document.getElementById('home').onclick=()=>go(0);
input.onchange=()=>go((Number(input.value)||1)-1,false);
const close=()=>parent.postMessage({type:'room-book-close'},location.origin);
stage.addEventListener('click',event=>{if(event.target===stage)close()});
document.getElementById('zoom').onclick=async()=>{
 zoomed=!zoomed;document.getElementById('zoom').textContent=zoomed?'見開き':'拡大';
 if(!zoomed){zoomCanvas?.remove();zoomCanvas=null;book.style.display='';stage.style.overflow='hidden';stage.style.display='grid';return}
 const selected=index>0&&index<pdf.numPages-1&&flip.getOrientation()==='landscape'?index+1:index;
 const page=await pdf.getPage(selected+1),base=page.getViewport({scale:1}),w=Math.min(1000,stage.clientWidth-24),view=page.getViewport({scale:w/base.width*Math.min(devicePixelRatio||1,2)});zoomCanvas=document.createElement('canvas');zoomCanvas.width=view.width;zoomCanvas.height=view.height;zoomCanvas.style.cssText=`display:block;width:${w}px;height:auto;margin:0 auto;background:white`;
 await page.render({canvasContext:zoomCanvas.getContext('2d'),viewport:view}).promise;if(!zoomed)return;book.style.display='none';stage.style.overflow='auto';stage.style.display='block';stage.append(zoomCanvas)
};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};
addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'戻す':'全画面'});
addEventListener('keydown',event=>{if(event.target===input)return;if(['ArrowLeft','ArrowRight','PageDown','PageUp','Home','End','Escape'].includes(event.key))event.preventDefault();if(event.key==='ArrowLeft'||event.key==='PageUp')document.getElementById('prev').click();if(event.key==='ArrowRight'||event.key==='PageDown')document.getElementById('next').click();if(event.key==='Home')go(0);if(event.key==='End'&&pdf)go(pdf.numPages-1,false);if(event.key==='Escape'&&!document.fullscreenElement)close()});
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdf&&!zoomed)build()},180)});
(async()=>{try{pdf=await pdfjsLib.getDocument({url:'portrait.pdf'}).promise;document.getElementById('total').textContent=pdf.numPages;input.max=pdf.numPages;try{index=Math.max(0,Math.min(pdf.numPages-1,(Number(sessionStorage.getItem(storageKey))||1)-1))}catch{}await build()}catch(error){fail(error)}})();
</script></body></html>
