<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホーム画面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;background:#fff;color:#b5b5b5}
#home{position:absolute;inset:0;background:#dceaf4;padding:24px 28px;color:#596c7c}
.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px;font-size:14px;font-weight:600}.status svg{width:60px;height:15px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px}
.app{border:0;background:none;padding:0;font:11px "IBM Plex Mono","SFMono-Regular",Menlo,monospace;color:inherit;text-shadow:0 1px 4px #000b;cursor:pointer;display:grid;gap:10px;justify-items:center}
.icon{width:min(72px,calc((100vw - 88px)/3));aspect-ratio:1;border-radius:17px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 6px #34473810;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:contain}.ll img{width:88%;height:88%}.k img{width:96%;height:auto}
iframe{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:white}iframe.active{display:block}
#homeButton{position:absolute;z-index:10;left:50%;bottom:6px;transform:translateX(-50%);width:100px;height:24px;border:0;background:transparent;cursor:pointer}
#homeButton:after{content:'';display:block;width:100%;height:4px;border-radius:4px;background:#fff;box-shadow:0 0 2px #0008}
.hint{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:10px;color:#7b887e}
button:focus-visible{outline:1px solid #b5b5b5;outline-offset:4px}
#standby{position:absolute;z-index:20;inset:0;width:100%;height:100%;border:0;color:white;background:#687c70;display:flex;flex-direction:column;align-items:center;padding-top:110px;cursor:pointer;transition:opacity .6s ease;font:inherit}#standby time{font:64px/1.2 Helvetica,Arial,sans-serif;letter-spacing:-3px}#standby small{margin-top:10px;font-size:12px}#standby.awake{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#standby{transition:none}}
#standby{background:#dceaf4;color:#596c7c}.app{text-shadow:none}.status svg [stroke="white"]{stroke:currentColor}.status svg [fill="white"]{fill:currentColor}#homeButton:after{background:#596c7c;box-shadow:none}
</style></head><body><div id="home"><div class="status"><span>9:41</span><svg viewBox="0 0 60 15" aria-hidden="true"><path d="M1 12V10h3v2m3 0V7h3v5m3 0V4h3v8m3 0V1h3v11" fill="none" stroke="white" stroke-width="2"/><path d="M28 5q7-7 14 0m-12 3q5-5 10 0m-8 3q3-3 6 0" fill="none" stroke="white" stroke-width="1.5"/><rect x="46" y="3" width="11" height="8" rx="2" fill="none" stroke="white"/><path d="M58 5v4" stroke="white"/><rect x="48" y="5" width="7" height="4" rx="1" fill="white"/></svg></div><div class="apps">
<button class="app" data-app="kuwasawa" aria-label="桑沢アプリを開く"><span class="icon k"><img src="/Portfolio/embedded/kuwasawa/assets/image-0001.png" alt="桑沢 オリジナルロゴ"></span><span>桑沢</span></button>
<button class="app" data-app="light-language" aria-label="Light Language を開く"><span class="icon ll"><img src="/Portfolio/room-content/light-language-icon.png" alt="Light Language オリジナルアイコン"></span><span>Light Language</span></button>
<button class="app" data-app="toretate" aria-label="採れたてを開く"><span class="icon"><img src="/Portfolio/room-content/toretate-icon.png" alt="採れたて オリジナルロゴ"></span><span>採れたて</span></button>
</div></div>
<button id="standby" aria-label="画面を起こす"><time>9:41</time><small>ZOU MENG</small></button><div id="appHost"></div><button id="homeButton" aria-label="ホーム画面に戻る" title="ホーム画面に戻る"></button>
<script src="/Portfolio/room-content/device-bridge.js"></script><script>
const urls={kuwasawa:'/Portfolio/room-content/kuwasawa.html', 'light-language':'/Portfolio/room-content/light-language.html', toretate:'/Portfolio/room-content/toretate.html'};
const frames=new Map();
const standby=document.getElementById('standby');
function wake(){standby.classList.add('awake');standby.tabIndex=-1;standby.setAttribute('aria-hidden','true');}
standby.onclick=wake;setTimeout(wake,matchMedia('(prefers-reduced-motion: reduce)').matches?0:1100);
function home(){frames.forEach(frame=>{frame.classList.remove('active');frame.inert=true;});document.getElementById('home').hidden=false;parent.postMessage({type:'room-phone-state',app:null},location.origin);}
document.querySelectorAll('[data-app]').forEach(button=>button.onclick=()=>{
  const id=button.dataset.app;
  if(!frames.has(id)){
    const frame=document.createElement('iframe');frame.src=urls[id];frame.title=id==='kuwasawa'?'桑沢':id==='toretate'?'採れたて':'Light Language';frame.id=`app-${id}`;
    frames.set(id,frame);document.getElementById('appHost').append(frame);
  }
  frames.forEach((frame,key)=>{frame.classList.toggle('active',key===id);frame.inert=key!==id;});
  document.getElementById('home').hidden=true;parent.postMessage({type:'room-phone-state',app:id},location.origin);
});
document.getElementById('homeButton').onclick=home;
addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.source===parent&&event.data?.type==='room-phone-home')home();});
</script></body></html>
