.calendar{position:absolute;top:118px;left:24px;width:342px;height:314px;border:1px solid #111827;border-radius:24px;padding:15px 10px 12px;background:white}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:40px;gap:5px 4px}
.day{position:relative;border:0;background:rgba(242,244,246,.68);border-radius:5px;color:#d9dde3;font-size:7px;padding:0;overflow:hidden}
.day .date{position:absolute;left:4px;top:3px;font-size:6px;color:rgba(255,255,255,.72)}
.day .count{font-size:18px;font-weight:600;color:#111827}
.day.learned{background:var(--pink)}
.day.strong{background:var(--pinkStrong)}
.day.selected{box-shadow:inset 0 0 0 1.5px #111827}
.calendar-bottom{position:absolute;left:9px;right:9px;bottom:8px}
.month-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:#9ca3af;font-size:10px;margin-bottom:9px}
.month-row b{font-weight:400}
.cal-nav{width:20px;height:20px;border:0;border-radius:50%;background:#f3f4f6;color:#a4a9b2;padding:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);font-size:8px;color:#a2a6ae;text-align:center}
.cal-total{text-align:right;font-size:8px;color:#7b8290;margin-top:4px}
.day-detail{position:absolute;top:442px;left:24px;right:24px;height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;color:#6b7280}
.day-detail strong{font-size:11px;font-weight:600;color:#111827}
.day-detail span{font-size:8px;line-height:1.35;text-align:right}
.progress-lists{position:absolute;top:486px;left:24px;right:24px}
.progress-lists h2{font-size:20px;font-weight:600;letter-spacing:0;margin:0 0 10px;color:#000}
.progress-list-btn{width:100%;height:60px;border:1px solid #111827;border-radius:30px;background:white;text-align:left;padding:0 16px;font-size:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:20px}
.progress-list-btn.more{border-color:var(--pinkStrong)}
.progress-list-btn span{font-size:9px;color:#7b7180;margin-left:5px}
.list-page{background:#fff}
.list-page h1{position:absolute;top:67px;left:24px;font-size:24px;font-weight:600;letter-spacing:0;margin:0;color:#111827}
.word-list{position:absolute;top:122px;left:20px;right:20px;bottom:104px;overflow:auto;display:grid;align-content:start;gap:12px}
.word-row{height:54px;border:1px solid var(--pinkStrong);border-radius:27px;background:white;font-size:18px;font-weight:600}
.word-row small{font-size:10px;font-weight:400;margin-left:5px}
.record-detail{background:var(--pink2);color:#172033}
.record-detail .record-wrap{position:absolute;top:102px;left:24px;right:24px;bottom:104px;overflow:auto}
.record-detail .record-word{font-size:48px;font-weight:600;letter-spacing:.04em;margin:0 0 20px}
.record-detail .record-block{margin-bottom:24px}
.record-detail .record-meta{display:flex;gap:10px;align-items:baseline;margin-bottom:5px}
.record-detail .record-meta span{font-size:10px}
.record-detail .record-meta strong{font-size:19px;font-weight:600}
.record-detail .record-block p{font-size:12px;line-height:1.45;margin:0 0 4px}

/* My page */
.profile-page{background:#fff}
.profile-page .back{top:67px;left:20px;width:32px;height:32px}
.profile-page .section-head{position:absolute;top:70px;left:64px;right:24px}
.profile-page .section-head h1{font-size:28px;font-weight:400;line-height:1.05;margin:0;color:var(--inkStrong);letter-spacing:.005em}
.profile-identity{position:absolute;top:126px;left:24px;right:24px;height:64px;display:flex;align-items:center;gap:12px}
.profile-avatar{width:42px;height:42px;flex:0 0 42px;object-fit:contain}
.profile-id-text{min-width:0}
.profile-name{font-size:18px;font-weight:600;line-height:1.15;color:var(--inkStrong)}
.profile-meta{font-size:11px;font-weight:400;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-section{position:absolute;left:24px;right:24px}
.profile-section h2{font-size:16px;font-weight:600;margin:0 0 10px;color:var(--inkStrong)}
.profile-favs{top:216px}
.profile-notes{top:318px}
.profile-chips{display:flex;flex-wrap:wrap;gap:8px}
.profile-chip{border:0;border-radius:17px;padding:8px 13px;background:var(--yellow2);font-size:12px;font-weight:400;color:var(--inkStrong)}
.profile-note{width:100%;height:45px;border:0;border-radius:18px;background:var(--green2);text-align:left;padding:0 14px;font-size:11px;font-weight:400;color:var(--inkStrong);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-actions{position:absolute;top:432px;left:24px;right:24px;display:grid;gap:9px}
.profile-actions button{height:46px;border:0;border-radius:22px;text-align:left;padding:0 15px;font-size:13px;font-weight:600;color:var(--inkStrong)}
.profile-actions button:nth-child(1){background:var(--blue3)}
.profile-actions button:nth-child(2){background:var(--green2)}
.profile-actions button:nth-child(3){background:var(--pink2)}
.profile-actions button:nth-child(4){background:var(--soft)}

.toast{position:absolute;z-index:50;left:50%;bottom:112px;transform:translateX(-50%);background:rgba(20,27,40,.9);color:white;border-radius:18px;padding:8px 14px;font-size:11px;animation:toast 1.25s ease both}@keyframes toast{0%{opacity:0;transform:translate(-50%,7px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
@media(prefers-reduced-motion:reduce){.blob,.dots i,.nav.active .ico{animation:none!important}.screen{animation:none}}
html,body{background:#fff!important}</style>
<style>.portfolio-guest{position:absolute;z-index:4;bottom:27px;left:0;width:100%;border:0;background:none;color:#fff;font-size:14px;text-decoration:underline;text-underline-offset:4px}.portfolio-guest:hover{opacity:.75}</style></head>
<body>
<main class="stage"><div id="app" class="app"></div></main>
<script>
const app=document.querySelector('#app'); const root=document.documentElement; const W=390,H=844;
const state={
  route:location.hash.slice(1)||'landing',
  lang:{q3:'English',q4:'日本語',q5:'中文'},
  book:0,
  word:0,
  classified:[],
  listKind:'more',
  recordWord:0,
  note:'',
  noteQuestion:'',
  savedNotes:[],
  testWord:0,
  testSelections:[],
  testHistory:[],
  testFeedback:false,
  favorites:[],
  selectedDay:23
};
const words=[
 {word:'light',pos:'adjective',jp:'軽い',ex:'I only carry a light bag, so I can move freely.',jpex:'自由に動けるように、軽いバッグだけを持っている。',cn:'我只带一个轻便的包，所以可以自由行动。',detail:[['adjective','軽い','I only carry a light bag, so I can move freely.','自由に動けるように、軽いバッグだけを持っている。'],['noun','光','The light from the window wakes me up every morning.','毎朝、窓からの光で目が覚める。'],['verb','照らす','Please light the candles on the cake.','ケーキのろうそくに火をつけてください。']]},
 {word:'language',pos:'noun',jp:'言語',ex:'Language connects people across different cultures.',jpex:'言語は、異なる文化の人々をつなぐ。',cn:'语言连接着不同文化背景的人们。',detail:[['noun','言語','Language connects people across different cultures.','言語は、異なる文化の人々をつなぐ。'],['noun','表現','Visual language can be as strong as words.','視覚的な表現は言葉と同じくらい強くなれる。']]},
 {word:'study',pos:'verb / noun',jp:'勉強する・学習',ex:'I study a little every day.',jpex:'毎日少しずつ勉強する。',cn:'我每天都会学习一点。',detail:[['verb','勉強する','I study a little every day.','毎日少しずつ勉強する。'],['noun','学習','This study changed the way I learn.','この学習で学び方が変わった。']]},
 {word:'subtle',pos:'adjective',jp:'微妙な・繊細な',ex:'The difference is subtle, but important.',jpex:'違いは繊細だが、大切だ。',cn:'差异很细微，但很重要。',detail:[['adjective','微妙な・繊細な','The difference is subtle, but important.','違いは繊細だが、大切だ。']]},
 {word:'vivid',pos:'adjective',jp:'鮮やかな',ex:'I still have a vivid memory of that day.',jpex:'あの日のことを今でも鮮明に覚えている。',cn:'我仍然清晰地记得那一天。',detail:[['adjective','鮮やかな','I still have a vivid memory of that day.','あの日のことを今でも鮮明に覚えている。']]},
 {word:'flexible',pos:'adjective',jp:'柔軟な',ex:'A flexible plan is easier to continue.',jpex:'柔軟な計画のほうが続けやすい。',cn:'灵活的计划更容易坚持。',detail:[['adjective','柔軟な','A flexible plan is easier to continue.','柔軟な計画のほうが続けやすい。']]}
];
const detailCN={
 light:['我只带一个轻便的包，这样就能自由行动。','每天早上，窗外的光都会把我唤醒。','请点亮蛋糕上的蜡烛。'],
 language:['语言连接着不同文化背景的人。','视觉语言也可以像文字一样有力量。'],
 study:['我每天都会学习一点。','这次学习改变了我的学习方式。'],
 subtle:['差异很细微，但很重要。'],
 vivid:['我仍然清晰地记得那一天。'],
 flexible:['灵活的计划更容易坚持。']
};
const testBank={
 light:{correct:['軽い','adjective','light up・輝かす','光','noun','照らす'],chips:['軽い','adjective','便利','light up・輝かす','軽くする','光','noun','照らす']},
 language:{correct:['言語','noun','表現'],chips:['言語','noun','会話','表現','verb','翻訳']},
 study:{correct:['勉強する','verb','学習','noun'],chips:['勉強する','verb','学校','学習','noun','adjective']}
};
const testWords=['light','language','study'];
function classifyWord(word,kind){
  state.classified=state.classified.filter(x=>x.word!==word);
  state.classified.push({word,kind});
}
function currentTestWord(){return testWords[state.testWord%testWords.length]}
function advanceTest(kind=null){
  const word=currentTestWord();
  if(kind) classifyWord(word,kind);
  if(!state.testHistory.includes(word)) state.testHistory.push(word);
  state.testWord=(state.testWord+1)%testWords.length;
  state.testSelections=[];
  render();
}
function exportNotesPDF(){
  const rows=state.savedNotes.length?state.savedNotes:(state.note?[{q:state.noteQuestion||'AI note',text:state.note}]:[]);
  const w=window.open('','_blank','width=760,height=860');
  if(!w){toast('PDF window was blocked');return}
  const body=rows.length?rows.map((n,i)=>`<section><h2>${i+1}. ${n.q}</h2><p>${n.text.replace(/\n/g,'<br>')}</p></section>`).join(''):'<p>No saved notes yet.</p>';
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Light Language Notes</title><style>body{font-family:Arial,"Yu Gothic",sans-serif;padding:44px;color:#1f2937}h1{font-size:24px}h2{font-size:15px;margin-top:28px}p{font-size:12px;line-height:1.7}@media print{button{display:none}}</style></head><body><h1>Light Language — Notes</h1>${body}<button onclick="window.print()">Save as PDF</button></body></html>`);
  w.document.close();
  setTimeout(()=>w.focus(),100);
}

function fit(){const m=innerWidth>480?28:0;root.style.setProperty('--scale',Math.max(.2,Math.min(1,innerWidth/W,(innerHeight-m*2)/H)))}addEventListener('resize',fit);fit();
function status(dark=false){return `<div class="status" style="color:${dark?'#fff':'#111'}"><span class="time">9:41</span><div class="icons"><span>▮▮▮</span><span>⌁</span><span class="battery"></span></div></div>`}
function field(){return `<div class="color-field" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="blob b5"></i></div>`}
function back(to='landing'){return `<button class="back" data-route="${to}" aria-label="Back"></button>`}
function next(to,disabled=false,label='NEXT'){return `<button class="next-frame" data-route="${to}" ${disabled?'disabled':''}>${label}</button>`}
const NAV_ICONS={vocab:'assets/svg/vector-0001.svg',notes:'assets/svg/vector-0002.svg',test:'assets/svg/vector-0003.svg',progress:'assets/svg/vector-0004.svg'};
function nav(active){const items=['vocab','notes','test','progress'];return `<nav class="bottom-nav">${items.map(r=>`<button class="nav ${active===r?'active':''}" data-route="${r}" aria-label="${r}"><img src="${NAV_ICONS[r]}" alt=""></button>`).join('')}</nav>`}
function landing(){return `<section class="screen landing">${field()}<svg class="landing-logo-svg" viewBox="120 205 155 125" aria-label="Light Language logo"><path d="M212.368 324.762C207.898 324.93 203.444 324.147 199.298 322.466C195.153 320.785 191.411 318.244 188.32 315.009C185.972 312.406 183.902 309.564 182.146 306.53C177.617 308.132 172.809 308.791 168.016 308.464C163.224 308.138 158.549 306.835 154.279 304.633C145.304 299.685 138.042 292.127 133.454 282.961C128.04 272.575 124.631 261.261 123.407 249.611C120.834 227.288 131.125 217.156 135.675 213.824C139.077 211.228 143.097 209.565 147.338 209C151.58 208.435 155.895 208.986 159.858 210.6C169.634 214.989 175.375 226.15 176.702 240.156C178.118 256.99 181.92 273.537 187.995 289.3C193.411 285.995 199.532 281.66 205.544 277.434C212.812 272.082 220.37 267.135 228.183 262.615C247.384 252.402 262.576 257.495 269.238 267.221C275.44 276.377 275.007 291.305 260.031 304.065C249.41 313.469 236.671 320.161 222.903 323.57C219.445 324.351 215.913 324.751 212.368 324.762ZM193.763 300.841C194.889 302.773 196.205 304.588 197.69 306.259C203.756 312.842 213.235 312.463 220.113 311C231.781 307.974 242.572 302.238 251.609 294.258C258.027 288.839 262.631 280.549 258.514 274.481C255.292 269.74 246.328 267.546 234.277 273.966C226.95 278.273 219.846 282.948 212.991 287.972C206.437 292.713 199.694 297.319 193.763 300.841ZM149.73 222.032C147.392 222.046 145.122 222.816 143.257 224.227C137.597 228.372 134.943 237.312 136.189 248.148C138.681 269.821 147.807 286.943 160.02 293.174C165.038 295.743 170.837 296.333 176.269 294.826C169.738 277.607 165.575 259.58 163.893 241.24C162.647 228.101 156.527 224.01 153.954 222.845C152.619 222.279 151.179 222.002 149.73 222.032Z" fill="white"/></svg><div class="tagline">Light the language.</div><div class="landing-actions"><button class="pill signin" data-route="signin">sign in</button><button class="pill signup" data-route="signup">create account</button></div><button class="portfolio-guest" data-route="vocab">continue as guest</button></section>`}
function auth(mode){const sign=mode==='signup';return `<section class="screen auth ${sign?'signup':''}"><div class="auth-hero">${field()}<div class="auth-copy">Light your study.</div></div>${back('landing')}<div class="auth-sheet"><h1 class="auth-title">${sign?'create account':'sign in'}</h1><div class="fields">${sign?'<input class="field" placeholder="name" autocomplete="name">':''}<input class="field" placeholder="email" type="email" autocomplete="email"><input class="field" placeholder="password" type="password" autocomplete="current-password"></div><div class="small-row">${sign?'':'<button class="textbtn" data-demo="forgot">forgot password?</button>'}</div><button class="auth-primary" data-route="q1">${sign?'create account':'sign in'}</button><div class="divider">or</div><button class="auth-secondary" data-route="vocab">continue as guest</button><p class="switch">${sign?'Already have an account? <button data-route="signin">sign in</button>':'New here? <button data-route="signup">create account</button>'}</p></div></section>`}
function q1(){return `<section class="screen">${status()}${back('signin')}<div class="intro-center"><h1 class="intro-title">Ready to begin?</h1><p class="intro-copy">Just a few quick questions<br>to make this all yours.</p></div><button class="bottom-action" data-route="q2">OK</button></section>`}
function q2(){return `<section class="screen">${status()}${back('q1')}<div class="explain"><h1>This app is built for multilingual learners.</h1><p>Combine three languages and decide what role each one plays while you study.</p><div class="explain-list"><div class="explain-chip blue">Language you want to learn.</div><div class="explain-chip green">Language you use to learn.</div><div class="explain-chip yellow">Language for hidden translations.</div></div></div><button class="bottom-action" data-route="q3">OK</button></section>`}
const langCfg={q3:['What is the language that you want to learn?','q4'],q4:['Which language do you want to use to learn it?','q5'],q5:['What language do you want for hidden translations?','setting']};
function selectScreen(step){const [title,to]=langCfg[step],langs=['English','日本語','한국어','中文','Français','Español','Deutsch'];return `<section class="screen select-screen" data-step="${step}">${status()}${back(step==='q3'?'q2':step==='q4'?'q3':'q4')}<h1>${title}</h1><div class="language-list">${langs.map(l=>`<button class="language-option" data-lang="${l}" data-step="${step}" data-next="${to}" data-selected="${state.lang[step]===l}">${l}</button>`).join('')}</div></section>`}
function setting(){setTimeout(()=>{if(state.route==='setting')go('books')},1300);return `<section class="screen setting">${field()}${status(true)}<div class="center"><h1>Setting up...</h1><p>${state.lang.q3||'English'} × ${state.lang.q4||'日本語'} × ${state.lang.q5||'中文'}<br>Your language preferences are loading.</p><div class="dots"><i></i><i></i><i></i></div></div></section>`}
const bookGroups=[
 {title:'おすすめ',items:[['Everyday'],['Design Words'],['Travel'],['Conversation'],['Daily 500'],['Starter']]},
 {title:'アイエルツ',items:[['IELTS 5.5'],['IELTS 6.5'],['Academic'],['Speaking'],['Writing'],['Vocabulary']]},
 {title:'TOEIC',items:[['TOEIC 600'],['TOEIC 700'],['TOEIC 800'],['Business'],['Listening'],['Reading']]}
];
function bookScreen(){let idx=0;const groups=bookGroups.map(g=>`<section class="book-section"><h2>${g.title}</h2><div class="book-row">${g.items.map(b=>{const i=idx++;return `<button class="book" data-book="${i}" data-selected="${state.book===i}"><div class="cover"><span class="tiny">LL</span><strong>${b[0]}</strong><small>LIGHT LANGUAGE</small></div></button>`}).join('')}</div></section>`).join('');return `<section class="screen books">${status()}${back('q5')}<div class="book-title">学習したい単語帳を選んでください</div><div class="book-sections">${groups}</div>${next('vocab',state.book===null,'GO ON')}</section>`}
function cardScreen(){const w=words[state.word];return `<section class="screen home">${status()}<h1 class="home-title">user name</h1><button class="avatar" data-route="profile" aria-label="Profile"><img src="assets/svg/vector-0005.svg" alt=""></button><div class="card-zone"><div class="stack back1"></div><div class="stack back2"></div><div class="classify done">完全記憶済み</div><div class="classify more">もっと学ぶ</div><article class="word-card" tabindex="0" aria-label="${w.word} word card"><div class="card-body"><div class="word-line"><div class="word">${w.word}</div><button class="word-speaker" data-speak aria-label="Play pronunciation"><img src="assets/svg/vector-0006.svg" alt=""></button></div><div class="pos">·${w.pos}</div><p class="jp">${w.jp}</p><p class="example">${w.ex}</p></div></article></div>${nav('vocab')}</section>`}
function detail(){const w=words[state.word],cn=detailCN[w.word]||[];const showTranslation=(state.lang.q4||'日本語')!==(state.lang.q5||'中文');return `<section class="screen detail">${status(true)}<button class="detail-tap" data-route="vocab" aria-label="Back to cards"></button><div class="detail-wrap"><div class="detail-wordline"><span class="word">${w.word}</span><button class="detail-speaker" data-detail-speak aria-label="Play pronunciation"><img src="assets/svg/vector-0006.svg" alt=""></button></div>${w.detail.map((d,i)=>`<section class="detail-block"><div class="detail-meta"><span class="pos">${d[0]}</span><p class="jp">${d[1]}</p></div><p class="example">${d[2]}</p><p class="detail-learning">${d[3]}${showTranslation?`<button class="detail-translate" data-detail-translate="${i}">翻訳</button><span class="detail-cn" data-detail-cn="${i}">${cn[i]||''}</span>`:''}</p></section>`).join('')}</div>${nav('vocab')}</section>`}

function notes(){return `<section class="screen notes-page">${status()}<h1 class="module-title">AI notes</h1><button class="module-profile" data-route="profile" aria-label="My page"><img src="assets/svg/vector-0005.svg" alt=""></button><div class="note-card"><h2>${state.note?'Your note':'Try asking something.'}</h2><p>${state.note||'気になった単語や表現を、そのまま質問してみましょう。\nAIが短く整理して、あとからノートとして保存できます。'}</p></div><div class="suggests"><button data-suggest="light と bright の違いは？">light / bright</button><button data-suggest="study の自然な使い方は？">study の使い方</button><button data-suggest="language の例文を3つ">例文を3つ</button></div><div class="note-tools"><button class="note-save" data-save-note>save note</button><button class="note-pdf" data-export-notes>export PDF</button></div><div class="ask"><input id="ask" placeholder="AIに質問する"><button data-generate>＋</button></div>${nav('notes')}</section>`}

function test(){const word=currentTestWord(),bank=testBank[word],fav=state.favorites.includes(word);const selected=state.testSelections;const cardW=Math.max(180,Math.min(320,120+word.length*19));const cardLeft=(390-cardW)/2;return `<section class="screen test-page">${status()}<h1 class="test-title">test</h1><button class="test-heart" data-favorite="${word}" data-fav="${fav}" aria-label="favorite">${fav?'♥':'♡'}</button><div class="quiz-card" style="width:${cardW}px;left:${cardLeft}px"><span class="word">${word}</span><button class="quiz-speaker" data-test-speak aria-label="Play pronunciation"><img src="assets/svg/vector-0006.svg" alt=""></button></div><div class="answers">${bank.chips.map(o=>{const chosen=selected.includes(o),correct=bank.correct.includes(o);return `<span class="answer-wrap"><button data-test-chip="${o}" class="${chosen?'chosen ':''}${chosen?(correct?'correct':'wrong'):''}">${o}</button></span>`}).join('')}</div>${state.testFeedback?'<div class="test-feedback">正解！</div>':''}<div class="test-progress">${selected.filter(x=>bank.correct.includes(x)).length} / ${bank.correct.length}</div><div class="test-classify"><button data-test-classify="more">もっと学ぶ</button><button data-test-classify="done">完全記憶済み</button></div>${nav('test')}</section>`}
function categoryWords(kind){const chosen=state.classified.filter(x=>x.kind===kind).map(x=>x.word);const seed=kind==='more'?['light','subtle','vivid','flexible']:['language','study'];return [...new Set(chosen.length?chosen:seed)]}
function progress(){const more=categoryWords('more'),done=categoryWords('done');const today=23;const learnedDays=[6,9,10,15,17,21,23,29,30],strongDays=[13,18,24];const counts={6:68,9:34,10:48,13:18,15:40,17:21,18:37,21:36,23:36,24:12,29:40,30:69};const days=Array.from({length:35},(_,i)=>{const n=i+1;if(n>31)return `<button class="day" disabled></button>`;const cls=learnedDays.includes(n)?'learned':(strongDays.includes(n)?'strong':'');return `<button class="day ${cls} ${state.selectedDay===n?'selected':''}" data-day="${n}"><span class="date">${n}</span>${counts[n]?`<span class="count">${counts[n]}</span>`:''}</button>`}).join('');const selected=state.selectedDay||today;let rec;if(selected===today){const learned=new Set([...state.testHistory,...state.classified.map(x=>x.word)]);rec={learned:learned.size||3,more:categoryWords('more').length,done:categoryWords('done').length,test:state.testHistory.length||2}}else{rec={learned:(selected%5)+2,more:(selected%3)+1,done:selected%4,test:selected%3}}return `<section class="screen progress-page">${status()}<h1 class="progress-title">calendar</h1><div class="calendar"><div class="calendar-grid">${days}</div><div class="calendar-bottom"><div class="month-row"><b>2026年9月</b><button class="cal-nav">‹</button><button class="cal-nav">›</button></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal-total">357/1683</div></div></div><div class="day-detail"><strong>9 / ${selected}</strong><span>学習 ${rec.learned} words　もっと学ぶ ${rec.more}　完全記憶 ${rec.done}</span></div><div class="progress-lists"><h2>「もっと学ぶ」リスト</h2><button class="progress-list-btn more" data-list="more">${more.join('、')} <span>${more.length} words</span></button><h2>「完全記憶済み」リスト</h2><button class="progress-list-btn" data-list="done">${done.join('、')} <span>${done.length} words</span></button></div>${nav('progress')}</section>`}
function progressList(){const kind=state.listKind,arr=categoryWords(kind);const title=kind==='more'?'「もっと学ぶ」リスト':'「完全記憶済み」リスト';return `<section class="screen list-page">${status()}<h1>${title}</h1><div class="word-list">${arr.map(w=>{const i=words.findIndex(x=>x.word===w),x=words[i]||words[0];return `<button class="word-row" data-record-word="${i<0?0:i}">${x.word}<small>${x.jp}</small></button>`}).join('')}</div>${nav('progress')}</section>`}
function recordDetail(){const w=words[state.recordWord]||words[0];return `<section class="screen record-detail">${status()}${back('progress-list')}<div class="record-wrap"><h1 class="record-word">${w.word}</h1>${w.detail.map(d=>`<section class="record-block"><div class="record-meta"><span>${d[0]}</span><strong>${d[1]}</strong></div><p>${d[2]}</p><p>${d[3]}</p></section>`).join('')}</div>${nav('progress')}</section>`}

function profile(){const favs=state.favorites.length?state.favorites:['light'];const notes=state.savedNotes.length?state.savedNotes:(state.note?[{q:state.noteQuestion||'AI note',text:state.note}]:[]);const learn=state.lang.q3||'English',via=state.lang.q4||'日本語',hidden=state.lang.q5||'中文';return `<section class="screen profile-page">${status()}${back('vocab')}<div class="section-head"><h1>my page</h1></div><div class="profile-identity"><img class="profile-avatar" src="assets/svg/vector-0005.svg" alt=""><div class="profile-id-text"><div class="profile-name">user name</div><div class="profile-meta">${learn} through ${via}${via!==hidden?` · ${hidden} translation`:''}</div></div></div><section class="profile-section profile-favs"><h2>favorites</h2><div class="profile-chips">${favs.map(w=>`<button class="profile-chip" data-profile-word="${w}">${w}</button>`).join('')}</div></section><section class="profile-section profile-notes"><h2>saved AI notes</h2>${notes.length?notes.slice(-3).map((n,i)=>`<button class="profile-note" data-profile-note="${i}">${n.q}</button>`).join(''):'<div class="profile-meta">まだ保存されたノートはありません。</div>'}</section><div class="profile-actions"><button data-route="books">単語帳</button><button data-route="notes">AI notes</button><button data-export-notes>notes を PDF に整理</button><button data-route="q3">言語設定</button></div></section>`}
const routes={landing,signin:()=>auth('signin'),signup:()=>auth('signup'),q1,q2,q3:()=>selectScreen('q3'),q4:()=>selectScreen('q4'),q5:()=>selectScreen('q5'),setting,books:bookScreen,vocab:cardScreen,detail,notes,test,progress,'progress-list':progressList,'record-detail':recordDetail,profile};
function render(){app.innerHTML=(routes[state.route]||landing)();bind()}
function go(r){state.route=r;try{history.pushState({r},'',`#${r}`)}catch(error){}render()}
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;app.append(d);setTimeout(()=>d.remove(),1300)}
function bind(){
 app.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();if(!el.disabled)go(el.dataset.route)}));
 app.querySelectorAll('.language-option').forEach(el=>el.addEventListener('click',()=>{
   state.lang[el.dataset.step]=el.dataset.lang;
   const nextRoute=el.dataset.next;
   render();
   setTimeout(()=>{ if(state.route===el.dataset.step) go(nextRoute); },260);
 }));
 app.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('click',()=>{state.book=+el.dataset.book;render()}));
 app.querySelector('[data-speak]')?.addEventListener('click',e=>{e.stopPropagation();const w=words[state.word].word;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}});
 app.querySelector('[data-detail-speak]')?.addEventListener('click',e=>{e.stopPropagation();const w=words[state.word].word;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}});
 app.querySelectorAll('[data-detail-translate]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const p=app.querySelector(`[data-detail-cn="${b.dataset.detailTranslate}"]`);p?.classList.toggle('show')}));
 app.querySelector('[data-test-speak]')?.addEventListener('click',e=>{e.stopPropagation();if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(currentTestWord());u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}});
 const card=app.querySelector('.word-card'); if(card){let sx=0,x=0,drag=false,moved=false;const done=app.querySelector('.classify.done'),more=app.querySelector('.classify.more');
  card.addEventListener('pointerdown',e=>{if(e.target.closest('[data-speak]'))return;drag=true;moved=false;sx=e.clientX;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});
  card.addEventListener('pointermove',e=>{if(!drag)return;x=e.clientX-sx;if(Math.abs(x)>4)moved=true;card.style.transform=`translateX(${x}px) rotate(${x/22}deg)`;done.style.opacity=x<0?Math.min(1,Math.abs(x)/90):0;more.style.opacity=x>0?Math.min(1,Math.abs(x)/90):0});
  const up=()=>{if(!drag)return;drag=false;card.classList.remove('dragging');if(Math.abs(x)>95){card.classList.add('snap');card.style.opacity='0';card.style.transform=`translateX(${x>0?430:-430}px) rotate(${x>0?16:-16}deg)`;classifyWord(words[state.word].word,x>0?'more':'done');setTimeout(()=>{state.word=(state.word+1)%words.length;render()},230)}else{card.classList.add('snap');card.style.transform='translateX(0) rotate(0)';done.style.opacity=more.style.opacity=0;if(!moved)go('detail');setTimeout(()=>card?.classList.remove('snap'),260)}x=0};card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('keydown',e=>{if(e.key==='Enter')go('detail')});}
 app.querySelectorAll('[data-list]').forEach(b=>b.addEventListener('click',()=>{state.listKind=b.dataset.list;go('progress-list')}));
 app.querySelectorAll('[data-record-word]').forEach(b=>b.addEventListener('click',()=>{state.recordWord=+b.dataset.recordWord;go('record-detail')}));
 app.querySelectorAll('[data-suggest]').forEach(b=>b.addEventListener('click',()=>{const i=app.querySelector('#ask');if(i)i.value=b.dataset.suggest}));
 app.querySelector('[data-generate]')?.addEventListener('click',()=>{const q=app.querySelector('#ask')?.value?.trim()||'light と bright の違いは？';state.noteQuestion=q;state.note=`${q}\n\nlight は「軽い／光」、bright は「明るい・鮮やか」というニュアンスです。例文と一緒に覚えると区別しやすくなります。`;render()});

 app.querySelectorAll('[data-test-chip]').forEach(b=>b.addEventListener('click',()=>{
   const word=currentTestWord(),bank=testBank[word],v=b.dataset.testChip;
   const wasSelected=state.testSelections.includes(v);
   if(wasSelected) state.testSelections=state.testSelections.filter(x=>x!==v);
   else state.testSelections=[...state.testSelections,v];
   const isCorrect=!wasSelected && bank.correct.includes(v);
   const allCorrect=bank.correct.every(x=>state.testSelections.includes(x));
   state.testFeedback=isCorrect;
   render();
   if(isCorrect){
     const wordAtClick=word;
     setTimeout(()=>{
       if(state.route!=='test' || currentTestWord()!==wordAtClick) return;
       state.testFeedback=false;
       if(allCorrect) advanceTest();
       else render();
     },650);
   }
 }));
 app.querySelectorAll('[data-test-classify]').forEach(b=>b.addEventListener('click',()=>advanceTest(b.dataset.testClassify)));
 app.querySelector('[data-favorite]')?.addEventListener('click',()=>{
   const w=currentTestWord();
   state.favorites=state.favorites.includes(w)?state.favorites.filter(x=>x!==w):[...state.favorites,w];
   render();
 });
 app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{state.selectedDay=+b.dataset.day;render()}));
 app.querySelector('[data-save-note]')?.addEventListener('click',()=>{
   if(!state.note){toast('先に AI note を作成してください');return}
   state.savedNotes.push({q:state.noteQuestion||'AI note',text:state.note});
   toast('note saved');
 });
 app.querySelectorAll('[data-export-notes]').forEach(b=>b.addEventListener('click',()=>exportNotesPDF()));
 app.querySelectorAll('[data-profile-word]').forEach(b=>b.addEventListener('click',()=>{
   const i=words.findIndex(x=>x.word===b.dataset.profileWord);
   if(i>=0){state.word=i;go('detail')}
 }));
 app.querySelectorAll('[data-profile-note]').forEach(b=>b.addEventListener('click',()=>{
   const notes=state.savedNotes.length?state.savedNotes:(state.note?[{q:state.noteQuestion||'AI note',text:state.note}]:[]);
   const n=notes[+b.dataset.profileNote];
   if(n){state.noteQuestion=n.q;state.note=n.text;go('notes')}
 }));

 app.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>toast('demo interaction')));
}
addEventListener('popstate',()=>{state.route=location.hash.slice(1)||'landing';render()});
render();
</script>
</body></html>
